version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: 'develop'
    schedule:
      interval: monthly
      time: '09:00'
      timezone: 'Europe/Moscow'
    labels:
      - actions
    reviewers:
      - GregoryGost
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=5.8.0']
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    target-branch: 'develop'
    schedule:
      interval: monthly
      time: '09:00'
      timezone: 'Europe/Moscow'
    labels:
      - pnpm
      - dependencies
    reviewers:
      - GregoryGost
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=5.8.0']
    groups:
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        update-types:
          - patch
