name: Lint Codebase

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ^10

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        id: pnpm-install
        run: pnpm i --frozen-lockfile

      - name: Lint Codebase
        id: super-linter
        uses: super-linter/super-linter/slim@v8
        env:
          DEFAULT_BRANCH: develop
          FILTER_REGEX_EXCLUDE: (dist|__tests__)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKOV_FILE_NAME: .checkov.yml
          LINTER_RULES_PATH: .
          # migration from 7.4.0 to 8
          # https://github.com/super-linter/super-linter/blob/d5b0a2ab116623730dd094f15ddc1b6b25bf7b99/docs/upgrade-guide.md?plain=1#L42
          # enabled all
          VALIDATE_ALL_CODEBASE: true
          # disabled not needed
          VALIDATE_JSCPD: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_JAVASCRIPT_ES: false
          # for eslint 9 (flat config)
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          # if error - OK exit
          DISABLE_ERRORS: true
          LOG_LEVEL: INFO
